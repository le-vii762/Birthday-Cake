<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday MAHA</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            background: radial-gradient(circle, #ffc0cb);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            font-family: 'Dancing Script', cursive;
        }

        .cake-scene {
            position: relative;
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
        }

        .plate {
            width: 280px;
            height: 50px;
            background: radial-gradient(circle, #696363);
            border-radius: 50%;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2), inset 0 -5px 10px rgba(0,0,0,0.1);
            z-index: 0;
            opacity: 0;
            transform: scale(0.5);
            animation: plateIn 0.8s ease-out forwards;
        }

        @keyframes plateIn { to { opacity: 1; transform: scale(1); } }

        .layer, .frosting {
            width: 200px;
            height: 45px;
            border-radius: 50% / 20px;
            margin-bottom: -25px;
            opacity: 0;
            transform: translateY(-800px);
            animation: dropIn 0.8s cubic-bezier(0.24, 1.21, 0.38, 1) forwards;
        }

        .l1 { background: #3d2616; animation-delay: 0.8s; z-index:1; }
        .l2 { background: #4e342e; animation-delay: 1.2s; z-index:2; }
        .l3 { background: #5d4037; animation-delay: 1.6s; z-index:3; }
        .l4 { background: #6d4c41; animation-delay: 2.0s; z-index:4; }
        .l5 { background: #795548; animation-delay: 2.4s; z-index:5; }
        .frosting { background: #ffffff; animation-delay: 2.8s; z-index:6; box-shadow: inset 0 -5px 10px rgba(0,0,0,0.05); }

        .candle-box {
            position: absolute;
            top: -65px;
            z-index: 10;
            opacity: 0;
            transform: translateY(-800px);
            animation: dropIn 0.5s ease-out forwards 3.4s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .candle { width: 8px; height: 45px; background: linear-gradient(to right, #ffd700, #fff176); border-radius: 2px; }
        .flame { width: 14px; height: 22px; background: radial-gradient(#fff, #ffeb3b, #ff9800); border-radius: 50% 50% 20% 20%; box-shadow: 0 0 20px #ff9800; animation: flicker 0.1s infinite alternate; }

        @keyframes dropIn { to { opacity:1; transform:translateY(0); } }
        @keyframes flicker { from { transform: scale(1); opacity: 0.9; } to { transform: scale(1.1); opacity:1; } }

        .text {
            margin-top: 60px;
            color: #ad1457;
            font-size: 3.5rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            opacity: 0;
            transform: scale(0.8);
            animation: textPop 1s cubic-bezier(0.17, 0.67, 0.83, 0.67) forwards 4s;
        }

        @keyframes textPop { to { opacity:1; transform: scale(1); } }
    </style>
</head>
<body>
    <div class="cake-scene">
        <div class="plate"></div>
        <div class="layer l1"></div>
        <div class="layer l2"></div>
        <div class="layer l3"></div>
        <div class="layer l4"></div>
        <div class="layer l5"></div>
        <div class="frosting"></div>
        <div class="candle-box">
            <div class="flame"></div>
            <div class="candle"></div>
        </div>
    </div>

    <div aria-posinset="center" class="text">Happy Birthday MAHA!<br> <center>18/5 </center> <br> <center>🤍 </center> </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script>
        setTimeout(() => {
            const end = Date.now() + 4500;
            (function frame() {
                confetti({ particleCount: 4, angle: 60, spread: 60, origin: { x:0, y:0.65 }, colors: ['#ff69b4','#ffffff','#ffd700'] });
                confetti({ particleCount: 4, angle: 120, spread: 60, origin: { x:1, y:0.65 }, colors: ['#ff69b4','#ffffff','#ffd700'] });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }, 3800);

        const flame = document.querySelector('.flame');
        const text = document.querySelector('.text');

        document.body.addEventListener('click', () => {
            text.textContent = 'Wish u have a sweet year ';
        });
        
    </script>
</body>
</html>
